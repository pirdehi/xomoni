# Builds the extension from a version tag and publishes it on GitHub Releases (docs/RELEASING.md).
# Two jobs (#142): `build` runs every npm script with a read-only token; `publish` runs no npm code, is the only
# one that can write, and the only one that sees the release signing key (#305). Actions are pinned by commit SHA;
# Dependabot keeps them current.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Placeholders: builds only need the variables to exist; they never call Supabase.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No token left in .git/config for npm scripts to find; the full history for the check below.
          persist-credentials: false
          fetch-depth: 0
      - name: The tag points at a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The whole quality gate, as for any merge
        run: npm run verify
      - name: Versions match the tag; the changelog has the section
        run: node tooling/release.mjs check "$GITHUB_REF_NAME"
      - name: Build the extension
        run: npm run build -w @xomoni/extension
      - name: No remotely hosted code in what gets zipped (#301)
        run: node tooling/check-remote-code.mjs
      - name: Package it reproducibly, with checksums
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          node tooling/release.mjs package
          node tooling/release.mjs notes "$GITHUB_REF_NAME" > apps/extension/release/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release
          path: apps/extension/release
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    # The release signing key is a secret of this environment, which only v* tags may use (docs/RELEASING.md).
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      # Ed25519 over each zip's bytes, for one-click updates of a zip install (#305, ADR-0033). Only OpenSSL runs here.
      # The key is written to a file only this job can read and removed when the step ends; it is never printed.
      - name: Sign the zips for one-click updates (Ed25519)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "::error::The RELEASE_SIGNING_KEY secret is not set: see Signing key in docs/RELEASING.md."
            exit 1
          fi
          key="$RUNNER_TEMP/release-signing.pem"
          public="$RUNNER_TEMP/release-signing.pub"
          trap 'rm -f "$key" "$public"' EXIT
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
          openssl pkey -in "$key" -pubout -out "$public"
          raw="$(openssl pkey -pubin -in "$public" -outform DER | tail -c 32 | base64)"
          # The release must trust its own signing key, or no Xomoni could check the next one.
          if ! grep -qxF "$raw" release/release-keys; then
            echo "::error::The extension doesn't trust this signing key. Add $raw to apps/extension/src/update/release-keys.json."
            exit 1
          fi
          for zip in release/*.zip; do
            openssl pkeyutl -sign -inkey "$key" -rawin -in "$zip" -out "$zip.sig"
            openssl pkeyutl -verify -pubin -inkey "$public" -rawin -in "$zip" -sigfile "$zip.sig"
          done
      - name: Sign where the zips were built (SLSA provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip release/*.zip.sig release/SHA256SUMS \
            --title "Xomoni ${GITHUB_REF_NAME#v}" --notes-file release/release-notes.md --verify-tag
