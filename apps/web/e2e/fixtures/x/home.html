<!doctype html>
<!--
  x.com/home as Xomoni's browser tests serve it (#342, ADR-0040), the page the X window opens on. Synthetic: the
  account is made up, never anyone's. Only what Xomoni reads is here (apps/extension/src/content/dom.ts): the sidebar's
  profile link, which names the signed-in account. Whether X counts as signed in is the twid cookie the tests set.
-->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Home / X</title>
  </head>
  <body>
    <div id="react-root">
      <header role="banner">
        <nav aria-label="Primary">
          <a href="/home" data-testid="AppTabBar_Home_Link" aria-current="page">Home</a>
          <a href="/xomoni_fixture" data-testid="AppTabBar_Profile_Link" aria-label="Profile">Profile</a>
        </nav>
      </header>
      <main role="main">
        <h1>Home</h1>
        <section aria-label="Timeline: Your Home Timeline"></section>
      </main>
    </div>
    <div id="layers"></div>
  </body>
</html>
