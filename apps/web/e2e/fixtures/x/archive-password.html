<!doctype html>
<!--
  x.com/settings/download_your_data as Xomoni's browser tests serve it (#345), where X first asks the person to confirm
  it's them: a password field, before it shows the archive. Synthetic, and only what Xomoni reads
  (apps/extension/src/content/dom.ts). Xomoni never types in it.
-->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Download an archive of your data / X</title>
  </head>
  <body>
    <div id="react-root">
      <header role="banner">
        <nav aria-label="Primary">
          <a href="/home" data-testid="AppTabBar_Home_Link">Home</a>
          <a href="/xomoni_fixture" data-testid="AppTabBar_Profile_Link" aria-label="Profile">Profile</a>
        </nav>
      </header>
      <main role="main">
        <div data-testid="primaryColumn">
          <h1>Verify your password</h1>
          <label>Password <input type="password" name="password" autocomplete="current-password" /></label>
          <button type="button">Confirm</button>
        </div>
      </main>
    </div>
  </body>
</html>
