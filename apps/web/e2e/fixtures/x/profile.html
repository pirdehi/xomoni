<!doctype html>
<!--
  x.com/xomoni_fixture as Xomoni's browser tests serve it (#342, ADR-0040), with its Replies and Likes tabs
  (/with_replies, /likes, #345), and the same pages of the other made-up account, x.com/fixture_friend (#345): the page
  shows the account its path names. Synthetic: the accounts, their posts and every id are made up, never anyone's. Only
  what Xomoni reads is here (apps/extension/src/content/dom.ts): the sidebar's profile link, the primary column, and
  posts as article[data-testid="tweet"] with their author line, time link, text, "…" button and like and repost
  buttons. A post that quotes another shows it inside, as X does, with the quoted post's time not linked. The sidebar
  names the account X's twid cookie says is signed in, as on home.html. As X's web app does, the page asks X's GraphQL
  API for the profile, then for the tab's timeline, and shows what X answered: its posts, X's empty state, or X's error
  panel when X refused either (a rate limit, X down), without asking for the timeline once the profile was refused. A
  post's text is drawn as X draws it: X sends it HTML-escaped, the page shows it decoded (#370). The interceptor reads
  the same answers (graphql/UserByScreenName.json, UserTweets.json, or another set a test serves).
-->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Fixture Person (@xomoni_fixture) / X</title>
  </head>
  <body>
    <div id="react-root">
      <header role="banner">
        <nav aria-label="Primary">
          <a href="/home" data-testid="AppTabBar_Home_Link">Home</a>
          <a href="/xomoni_fixture" data-testid="AppTabBar_Profile_Link" aria-label="Profile">Profile</a>
        </nav>
      </header>
      <main role="main">
        <div data-testid="primaryColumn">
          <h1 data-testid="UserName">Fixture Person <span>@xomoni_fixture</span></h1>
          <nav aria-label="Profile timelines">
            <a href="/xomoni_fixture">Posts</a>
            <a href="/xomoni_fixture/with_replies">Replies</a>
            <a href="/xomoni_fixture/likes">Likes</a>
          </nav>
          <section aria-label="Timeline: Fixture Person’s posts"></section>
        </div>
      </main>
    </div>
    <div id="layers"></div>
    <script>
      // As on home.html: the sidebar names the account X's twid cookie says is signed in, or no one.
      (() => {
        const HANDLES = { '9000000000000000001': 'xomoni_fixture', '9000000000000000002': 'fixture_friend' };
        const id = /(?:^|; )twid=u%3D(\d+)/.exec(document.cookie)?.[1];
        const link = document.querySelector('[data-testid="AppTabBar_Profile_Link"]');
        if (id && HANDLES[id]) link.setAttribute('href', `/${HANDLES[id]}`);
        else link.remove();
      })();
      // The account the path names: the fixture account's own pages, or the other made-up account's.
      (() => {
        const handle = location.pathname.split('/')[1];
        if (handle !== 'fixture_friend') return;
        document.title = 'Fixture Friend (@fixture_friend) / X';
        document.querySelector('h1').innerHTML = 'Fixture Friend <span>@fixture_friend</span>';
        for (const link of document.querySelectorAll('nav[aria-label="Profile timelines"] a'))
          link.setAttribute('href', link.getAttribute('href').replace('xomoni_fixture', handle));
        document.querySelector('section').setAttribute('aria-label', 'Timeline: Fixture Friend’s posts');
      })();
    </script>
    <script>
      (() => {
        const IDS = { xomoni_fixture: '9000000000000000001', fixture_friend: '9000000000000000002' };
        const handle = location.pathname.split('/')[1];
        const USER_ID = IDS[handle];
        const TIMELINES = { '': 'UserTweets', with_replies: 'UserTweetsAndReplies', likes: 'Likes' };
        const op = TIMELINES[location.pathname.split('/')[2] ?? ''];
        const timeline = document.querySelector('section');

        // X's web app asks its own GraphQL API, with the variables in the query string.
        const ask = (name, variables) =>
          fetch(`/i/api/graphql/fixtureQueryId/${name}?variables=${encodeURIComponent(JSON.stringify(variables))}`, {
            credentials: 'include',
          });

        const el = (tag, attrs = {}, ...children) => {
          const node = document.createElement(tag);
          for (const [name, value] of Object.entries(attrs)) node.setAttribute(name, value);
          node.append(...children);
          return node;
        };

        // The posts of a timeline answer, in order: every tweet_results.result of its entries.
        const posts = (json) =>
          (json?.data?.user?.result?.timeline?.timeline?.instructions ?? [])
            .flatMap((instruction) => instruction.entries ?? [])
            .map((entry) => entry.content?.itemContent?.tweet_results?.result)
            .filter((result) => result?.legacy);

        // X sends a post's text HTML-escaped ("R&amp;D &lt;3"), and its web app draws it decoded, as text (#370).
        const ESCAPED = { amp: '&', lt: '<', gt: '>', quot: '"', '#39': "'" };
        const shownText = (text) => text.replace(/&(amp|lt|gt|quot|#39);/g, (_, name) => ESCAPED[name]);

        const shortDate = (iso) =>
          new Date(iso).toLocaleDateString('en', { year: 'numeric', month: 'short', day: 'numeric' });

        // A quoted post, as X draws it inside the post that quotes it: its author, its time, which isn't a link, and
        // its text.
        const quotedPost = (result) => {
          const author = result.core.user_results.result.core;
          const iso = new Date(result.legacy.created_at).toISOString();
          return el(
            'div',
            { role: 'link', tabindex: '0' },
            el(
              'div',
              { 'data-testid': 'User-Name' },
              el('span', {}, author.name),
              el('span', {}, `@${author.screen_name}`),
              el('time', { datetime: iso }, shortDate(iso)),
            ),
            el('div', { 'data-testid': 'tweetText', lang: 'en' }, shownText(result.legacy.full_text)),
          );
        };

        // One post as X draws it; a repost draws the original under "You reposted", and a quote the post it quotes.
        const article = (result) => {
          const repost = result.legacy.retweeted_status_result?.result;
          const shown = repost ?? result;
          const { legacy } = shown;
          const author = shown.core.user_results.result.core;
          const quoted = shown.quoted_status_result?.result;
          const iso = new Date(legacy.created_at).toISOString();
          const button = (testid, label) =>
            el('button', { type: 'button', 'data-testid': testid, 'aria-label': label });
          return el(
            'article',
            { 'data-testid': 'tweet', tabindex: '0' },
            ...(repost ? [el('div', { 'data-testid': 'socialContext' }, 'You reposted')] : []),
            el(
              'div',
              { 'data-testid': 'User-Name' },
              el('a', { href: `/${author.screen_name}` }, author.name),
              el('a', { href: `/${author.screen_name}` }, `@${author.screen_name}`),
              el(
                'a',
                { href: `/${author.screen_name}/status/${legacy.id_str}` },
                el('time', { datetime: iso }, shortDate(iso)),
              ),
            ),
            button('caret', 'More'),
            el('div', { 'data-testid': 'tweetText', lang: 'en' }, shownText(legacy.full_text)),
            ...(quoted?.legacy ? [quotedPost(quoted)] : []),
            el(
              'div',
              { role: 'group' },
              button('reply', `${legacy.reply_count ?? 0} Replies. Reply`),
              legacy.retweeted
                ? button('unretweet', `${legacy.retweet_count ?? 0} reposts. Reposted`)
                : button('retweet', `${legacy.retweet_count ?? 0} reposts. Repost`),
              legacy.favorited
                ? button('unlike', `${legacy.favorite_count ?? 0} Likes. Liked`)
                : button('like', `${legacy.favorite_count ?? 0} Likes. Like`),
            ),
          );
        };

        const show = (response, json) => {
          if (!response.ok) {
            timeline.append(
              el(
                'div',
                { 'data-testid': 'error-detail' },
                'Something went wrong. Try reloading.',
                el('button', { type: 'button' }, 'Retry'),
              ),
            );
            return;
          }
          const list = posts(json);
          if (!list.length) timeline.append(el('div', { 'data-testid': 'emptyState' }, 'Nothing to see here — yet'));
          for (const result of list) timeline.append(article(result));
        };

        ask('UserByScreenName', { screen_name: handle })
          .then((profile) => (profile.ok ? ask(op, { userId: USER_ID, count: 20 }) : profile))
          .then(async (response) => show(response, response.ok ? await response.json() : null))
          .catch(() => show({ ok: false }, null));
      })();
    </script>
  </body>
</html>
