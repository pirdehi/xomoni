# Builds the extension from a version tag and publishes it on GitHub Releases (docs/RELEASING.md).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    env:
      # Placeholders: builds only need the variables to exist; they never call Supabase.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The whole quality gate, as for any merge
        run: npm run verify
      - name: Versions match the tag; the changelog has the section
        run: node tooling/release.mjs check "$GITHUB_REF_NAME"
      - name: Build the extension
        run: npm run build -w @xomoni/extension
      - name: Package it with checksums
        run: node tooling/release.mjs package
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tooling/release.mjs notes "$GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" apps/extension/release/* \
            --title "Xomoni ${GITHUB_REF_NAME#v}" --notes-file release-notes.md --verify-tag
