<!doctype html>
<!--
  Xomoni auth email: reauthentication.
  Supabase Auth renders this file as a Go template; see supabase/README.md#email-templates.
  Action links go to /auth/confirm on the website, which verifies the one-time token hash
  only when the person clicks, so links work on any device and mail scanners can't use them up.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light only" />
    <title>Your Xomoni verification code</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f4f1;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0b0b0b;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">Your Xomoni verification code.</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f1;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
            <tr>
              <td style="padding:0 4px 20px;">
                <a href="{{ .SiteURL }}" style="text-decoration:none;color:#0b0b0b;font-weight:600;font-size:16px;">
                  <img src="https://xomoni.com/logo.png" width="28" height="28" alt="" style="vertical-align:middle;border-radius:6px;border:0;" />
                  <span style="vertical-align:middle;padding-left:8px;">Xomoni</span>
                </a>
              </td>
            </tr>
            <tr>
              <td style="background:#fcfcfb;border:1px solid #e3e2de;border-radius:16px;padding:32px 28px;">
                <h1 style="margin:0 0 12px;font-size:20px;line-height:28px;font-weight:600;">Confirm it’s you</h1>
                <p style="margin:0 0 16px;font-size:15px;line-height:24px;color:#52514e;">Enter this code in Xomoni to confirm a sensitive change to your account:</p>
                <p style="margin:8px 0 24px;font-size:28px;letter-spacing:6px;font-weight:600;font-family:ui-monospace,Menlo,Consolas,monospace;">{{ .Token }}</p>
                <p style="margin:0 0 16px;font-size:15px;line-height:24px;color:#52514e;">The code expires in 1 hour.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 4px 0;font-size:12px;line-height:18px;color:#6f6d68;">
                If this wasn't you, reset your password now and write to privacy@xomoni.com.<br />
                Xomoni · <a href="{{ .SiteURL }}/privacy" style="color:#6f6d68;">Privacy</a> · Questions:
                <a href="mailto:privacy@xomoni.com" style="color:#6f6d68;">privacy@xomoni.com</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
