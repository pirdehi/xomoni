# The merge gate for main. Branch protection requires every job below to pass.
# `verify` is the same command the pre-push hook runs locally (tooling/verify.mjs). Actions are pinned by commit
# SHA (#142); Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    env:
      # Placeholders: builds only need the variables to exist; they never call Supabase.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatting, lint + code docs, types, architecture, docs, unit tests
        run: npm run verify
      - name: Build the extension
        run: npm run build -w @xomoni/extension
      - name: Release dry run (versions agree, the zip packages)
        run: node tooling/release.mjs check && node tooling/release.mjs package
      - name: Build the website
        run: npm run build -w @xomoni/web

  database:
    name: database
    runs-on: ubuntu-latest
    env:
      # config.toml reads these with env(); the local stack never talks to Google, Resend or Turnstile.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
      TURNSTILE_SECRET_KEY: ci-placeholder
      RESEND_SMTP_API_KEY: ci-placeholder
      # Pull Supabase images from Docker Hub: AWS ECR Public often answers "Data limit exceeded" to CI runners.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@d239d1052f6f024a8d746d7e5aeddead63b9cb53 # v1
        with:
          # Keep in step with the CLI used to generate packages/db (see CONTRIBUTING.md).
          version: 2.116.0
      - name: Apply all migrations to a fresh database
        run: supabase db start
      - name: Lint the schema
        run: supabase db lint --local --level warning --fail-on warning
      - name: Row Level Security tests (pgTAP)
        run: supabase test db
      - name: Generated types match the migrations
        run: |
          npm run gen -w @xomoni/db
          git diff --exit-code -- packages/db/src/database.types.ts \
            || (echo "::error::packages/db is out of date: run 'npm run gen -w @xomoni/db' and commit." && exit 1)

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
      TURNSTILE_SECRET_KEY: ci-placeholder
      RESEND_SMTP_API_KEY: ci-placeholder
      # Pull Supabase images from Docker Hub: AWS ECR Public often answers "Data limit exceeded" to CI runners.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@d239d1052f6f024a8d746d7e5aeddead63b9cb53 # v1
        with:
          version: 2.116.0
      - name: Start Supabase (Auth, Postgres, Realtime, Mailpit)
        run: supabase start -x studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Auth end-to-end tests (sign-up, confirmation, sign-in, reset, account)
        working-directory: apps/web
        run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
