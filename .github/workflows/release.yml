# Builds the extension from a version tag and publishes it on GitHub Releases (docs/RELEASING.md).
# Two jobs (#142): `build` runs every npm script with a read-only token; `publish` runs no npm code and is the only
# one that can write. Actions are pinned by commit SHA; Dependabot keeps them current.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Placeholders: builds only need the variables to exist; they never call Supabase.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No token left in .git/config for npm scripts to find; the full history for the check below.
          persist-credentials: false
          fetch-depth: 0
      - name: The tag points at a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The whole quality gate, as for any merge
        run: npm run verify
      - name: Versions match the tag; the changelog has the section
        run: node tooling/release.mjs check "$GITHUB_REF_NAME"
      - name: Build the extension
        run: npm run build -w @xomoni/extension
      - name: Package it reproducibly, with checksums
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          node tooling/release.mjs package
          node tooling/release.mjs notes "$GITHUB_REF_NAME" > apps/extension/release/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release
          path: apps/extension/release
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Sign where the zips were built (SLSA provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS \
            --title "Xomoni ${GITHUB_REF_NAME#v}" --notes-file release/release-notes.md --verify-tag
