# Builds the extension from a version tag and publishes it on GitHub Releases (docs/RELEASING.md).
# Five jobs (#142, #340, #343, ADR-0037):
# - `ci` runs the full CI (ci.yml: verify, database, e2e) again, on the tagged commit;
# - `readiness` reads the version's release issue and fails while a box under "Before the tag" is unticked;
# - `build`, once CI is green, runs every npm script with a read-only token;
# - `publish` runs no npm code, is the only job that can write the release, and the only one that sees the release
#   signing key (#305). After the release, it comments it on the release issue and closes the issue.
# - `after-release` calls release-check.yml once the release is out: it downloads the release as people get it, checks
#   the checksums, the provenance and releases/latest, and comments the result on the release issue.
# Actions are pinned by commit SHA; Dependabot keeps them current.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

jobs:
  # The same checks as every merge to main, on the commit being released (gate 4 of docs/QUALITY-GATES.md).
  ci:
    name: ci
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # The version's release issue (.github/ISSUE_TEMPLATE/release.md): open, labelled `release`, titled exactly
  # "Release vX.Y.Z", opened by someone who can push, and every box under "Before the tag" ticked. Its number goes to
  # `publish`. It only reads: GitHub, not this job, makes the release wait for the maintainer.
  readiness:
    name: readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      issue: ${{ steps.check.outputs.issue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: tooling
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: The release issue is complete
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node tooling/check-release-issue.mjs "$GITHUB_REF_NAME"

  build:
    name: build
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Placeholders: builds only need the variables to exist; they never call Supabase.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No token left in .git/config for npm scripts to find; the full history for the check below.
          persist-credentials: false
          fetch-depth: 0
      - name: The tag points at a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      # No dependency's install script runs where the release is built (#305, ADR-0033). None is needed: only esbuild
      # has one, and it works without it. The repository's own `prepare` (git hooks) has no place here either.
      - run: npm ci --ignore-scripts
      # Every dependency, the build's tools included: they make the zip (R12 of docs/QUALITY-GATES.md).
      - name: No dependency with a known high or critical vulnerability
        run: npm audit --audit-level=high
      - name: The whole quality gate, as for any merge
        run: npm run verify
      - name: Versions match the tag; the changelog has the section
        run: node tooling/release.mjs check "$GITHUB_REF_NAME"
      - name: Build the extension
        run: npm run build -w @xomoni/extension
      - name: No remotely hosted code in what gets zipped (#301)
        run: node tooling/check-remote-code.mjs
      - name: Package it reproducibly, with checksums
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          node tooling/release.mjs package
          node tooling/release.mjs notes "$GITHUB_REF_NAME" > apps/extension/release/release-notes.md
      # What the stores get (#303): the same code without the one-click updater, since a store updates Xomoni itself
      # (#305, ADR-0033). Built here, so the store workflow sends a zip this run built and attested, never a rebuild.
      - name: Build the store build
        run: npm run build:store -w @xomoni/extension
      - name: No remotely hosted code in the store build either (#301)
        run: node tooling/check-remote-code.mjs
      - name: Package the store build reproducibly, beside the zips
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          node tooling/release.mjs package-store
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release
          path: apps/extension/release
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: [build, readiness]
    runs-on: ubuntu-latest
    # The release signing key is a secret of this environment. GitHub, not this file, enforces its protection: only v*
    # tags may use it, and the maintainer approves each run (docs/RELEASING.md, Signing key).
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      # Only to comment the release on its issue and close it; no other job can write to issues.
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      # Ed25519 over each zip's bytes, for one-click updates of a zip install (#305, ADR-0033). Only OpenSSL runs here.
      # While the extension trusts no key, the release goes out unsigned, with a warning: no Xomoni can update in one
      # click without a key anyway. Once it trusts one, a release can't go out unsigned or signed by another key.
      # The key is written to a file only this job can read and removed when the step ends; it is never printed.
      - name: Sign the zips for one-click updates (Ed25519)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ ! -s release/release-keys ]; then
            echo "::warning::Not signed: apps/extension/src/update/release-keys.json trusts no signing key yet, so no Xomoni can update to this release in one click. See Signing key in docs/RELEASING.md."
            exit 0
          fi
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "::error::The extension trusts a signing key, but the RELEASE_SIGNING_KEY secret is not set: see Signing key in docs/RELEASING.md."
            exit 1
          fi
          key="$RUNNER_TEMP/release-signing.pem"
          public="$RUNNER_TEMP/release-signing.pub"
          trap 'rm -f "$key" "$public"' EXIT
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
          openssl pkey -in "$key" -pubout -out "$public"
          raw="$(openssl pkey -pubin -in "$public" -outform DER | tail -c 32 | base64)"
          # The release must trust its own signing key, or no Xomoni could check the next one.
          if ! grep -qxF "$raw" release/release-keys; then
            echo "::error::The extension doesn't trust this signing key. Add $raw to apps/extension/src/update/release-keys.json."
            exit 1
          fi
          for zip in release/*.zip; do
            # The store build has no updater, so nothing would check its signature (#303).
            case "$zip" in release/xomoni-extension-store-*) continue ;; esac
            openssl pkeyutl -sign -inkey "$key" -rawin -in "$zip" -out "$zip.sig"
            openssl pkeyutl -verify -pubin -inkey "$public" -rawin -in "$zip" -sigfile "$zip.sig"
          done
      # Every zip, the store build's included: the store workflow checks this before a store sees it (#303).
      - name: Sign where the zips were built (SLSA provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The signatures only when the release was signed (see the signing step).
          shopt -s nullglob
          files=(release/*.zip release/*.zip.sig release/SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --title "Xomoni ${GITHUB_REF_NAME#v}" --notes-file release/release-notes.md --verify-tag
      # The closed issue is the version's record (ADR-0037): what was checked, then the release and the run that made
      # it. When this step fails, the release is already out: comment and close the issue by hand.
      - name: Comment the release on its issue and close it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ needs.readiness.outputs.issue }}
        run: |
          set -euo pipefail
          if [[ ! "$ISSUE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The readiness job named no release issue. $GITHUB_REF_NAME is released: comment it on its issue and close the issue by hand."
            exit 1
          fi
          release_url="$(gh release view "$GITHUB_REF_NAME" --json url --jq .url)"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="$(printf 'Released %s: %s\n\nWorkflow run: %s\n' "$GITHUB_REF_NAME" "$release_url" "$run_url")"
          gh issue comment "$ISSUE" --body "$body"
          gh issue close "$ISSUE" --reason completed

  # The check after the release (R18 of docs/QUALITY-GATES.md, #343): what people download is what this run built.
  # A workflow of its own, so it can be run by hand for any release too. It can't wait for the `release` event: GitHub
  # starts no workflow for what this run's token does, and that token is what creates the release.
  after-release:
    name: after-release
    needs: publish
    permissions:
      contents: read
      attestations: read
      # Only for its report job, to comment the result on the release issue.
      issues: write
    uses: ./.github/workflows/release-check.yml
    with:
      tag: ${{ github.ref_name }}
