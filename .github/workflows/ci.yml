# The merge gate for main, and the first gate of every release. Branch protection requires every job below to pass,
# the release workflow calls this one on the tagged commit before it builds anything (#340, ADR-0037), and the nightly
# workflow calls it on main every night (#343).
# `verify` is the same command the pre-push hook runs locally (tooling/verify.mjs). Actions are pinned by commit
# SHA (#142); Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # From release.yml and nightly.yml, read-only, and given no secret.
  workflow_call:

permissions:
  contents: read

# A newer run for the same event and ref cancels the older one. Called by another workflow, this sees the caller's
# `github` context: the release's group is `ci-push-refs/tags/vX.Y.Z`, the nightly's `ci-schedule-refs/heads/main` (or
# `ci-workflow_dispatch-…`). No pull request (`ci-pull_request-refs/pull/N/merge`) or push to main
# (`ci-push-refs/heads/main`) shares them, so none of them cancels the release's or the nightly's CI or is cancelled by
# it (#343). A caller must never take a `ci-` group for itself: GitHub would then cancel one run for the other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    env:
      # Placeholders: builds only need the variables to exist; they never call Supabase.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatting, lint + code docs, types, architecture, docs, unit tests
        run: npm run verify
      - name: Build the extension
        run: npm run build -w @xomoni/extension
      - name: Release dry run (versions agree, the zip packages)
        run: node tooling/release.mjs check && node tooling/release.mjs package
      - name: Store build dry run (no remote code, it packages beside the zips)
        run: |
          npm run build:store -w @xomoni/extension
          node tooling/check-remote-code.mjs
          node tooling/release.mjs package-store
      - name: Build the website
        run: npm run build -w @xomoni/web

  database:
    name: database
    runs-on: ubuntu-latest
    env:
      # config.toml reads these with env(); the local stack never talks to Google, Resend or Turnstile.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
      TURNSTILE_SECRET_KEY: ci-placeholder
      RESEND_SMTP_API_KEY: ci-placeholder
      # Pull Supabase images from Docker Hub: AWS ECR Public often answers "Data limit exceeded" to CI runners.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v1
        with:
          # Keep in step with the CLI used to generate packages/db (see CONTRIBUTING.md).
          version: 2.116.0
      - name: Apply all migrations to a fresh database
        run: supabase db start
      - name: Lint the schema
        run: supabase db lint --local --level warning --fail-on warning
      - name: Row Level Security tests (pgTAP)
        run: supabase test db
      - name: Generated types match the migrations
        run: |
          npm run gen -w @xomoni/db
          git diff --exit-code -- packages/db/src/database.types.ts \
            || (echo "::error::packages/db is out of date: run 'npm run gen -w @xomoni/db' and commit." && exit 1)

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
      TURNSTILE_SECRET_KEY: ci-placeholder
      RESEND_SMTP_API_KEY: ci-placeholder
      # Pull Supabase images from Docker Hub: AWS ECR Public often answers "Data limit exceeded" to CI runners.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v1
        with:
          version: 2.116.0
      - name: Start Supabase (Auth, Postgres, Realtime, Mailpit)
        run: supabase start -x studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Auth end-to-end tests (sign-up, confirmation, sign-in, reset, account)
        working-directory: apps/web
        run: npx playwright test
      # The built extension in Chromium, on x.com pages served from synthetic fixtures, with no network (#342,
      # ADR-0040). It needs neither the site nor Supabase, and runs even when the site's tests failed.
      - name: The extension in a real browser (dashboard, content script on X fixtures, axe)
        if: ${{ !cancelled() }}
        working-directory: apps/web
        run: npx playwright test -c playwright.extension.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # The same tests in Microsoft Edge (#342): the website's, and the extension's, which Edge installs the way its
  # developer tools do. GitHub's Ubuntu runners come with Edge; it is installed only when one doesn't. The one job here
  # that branch protection doesn't require yet: it will once the ruleset names it.
  e2e-edge:
    name: e2e-edge
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
      TURNSTILE_SECRET_KEY: ci-placeholder
      RESEND_SMTP_API_KEY: ci-placeholder
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
      XOMONI_E2E_BROWSERS: msedge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v1
        with:
          version: 2.116.0
      - name: Start Supabase (Auth, Postgres, Realtime, Mailpit)
        run: supabase start -x studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Microsoft Edge
        working-directory: apps/web
        run: |
          if [ ! -x /opt/microsoft/msedge/msedge ]; then npx playwright install --with-deps msedge; fi
          /opt/microsoft/msedge/msedge --version
      - name: The website's end-to-end tests in Edge
        working-directory: apps/web
        run: npx playwright test
      - name: The extension in Edge (dashboard, content script on X fixtures, axe)
        if: ${{ !cancelled() }}
        working-directory: apps/web
        run: npx playwright test -c playwright.extension.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report-edge
          path: apps/web/playwright-report
          retention-days: 7
